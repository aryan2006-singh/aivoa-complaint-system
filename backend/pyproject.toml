[project]
name = "aivoa-complaint-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pgvector>=0.3.6",
  "langgraph>=0.2.60",
  "groq>=0.11",
  "sentence-transformers>=3.0",
  "pypdf>=4.3",
  "tenacity>=8.5",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The module-level async engine in app/db/session.py is created once at import
# and its asyncpg connection pool binds to whichever event loop first uses it.
# pytest-asyncio's default "function" loop scope gives each test its own event
# loop, so a later DB-touching test tries to reuse a connection whose socket
# transport belongs to an already-closed loop (Windows ProactorEventLoop:
# "Event loop is closed" / "'NoneType' object has no attribute 'send'"). A
# session-scoped loop keeps one event loop for the whole run, matching the
# engine's actual lifetime. This only affects test collection/execution, not
# the app's production pooling behavior.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
